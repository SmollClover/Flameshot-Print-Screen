[package]
name = "flameshot-print-screen"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }   

[[bin]]
name = "Print-Screen-Uploader"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
opt-level = 3

[dependencies]
home = "0.5.12"
log = "0.4.35"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["blocking", "json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simplelog = "0.12.2"
time = "0.3.55"
